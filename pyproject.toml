[project]
name = "python-crawling-mcp"
version = "0.1.0"
description = "Secure, extensible crawling MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "crawlee[beautifulsoup,playwright]>=1.8.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.28.1,<2",
  "playwright>=1.61,<2",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
]

[project.scripts]
crawling-mcp = "crawling_mcp.__main__:main"
crawling-mcp-test-site = "crawling_mcp.test_site:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-beautifulsoup4>=4.12,<5",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawling_mcp"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: tests requiring a local HTTP server or Playwright"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crawling_mcp"]

[[tool.mypy.overrides]]
module = ["crawlee.*"]
ignore_missing_imports = true
