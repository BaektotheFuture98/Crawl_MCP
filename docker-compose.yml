services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crawling
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawling"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9009:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    entrypoint: ["/app/.venv/bin/alembic", "upgrade", "head"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      CRAWLING_MCP_ALLOW_PRIVATE_NETWORKS: "false"
    stdin_open: true
    volumes:
      - auth-data:/app/data/auth
      - failures-data:/app/data/failures
      - screenshots-data:/app/data/screenshots
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  test-site:
    profiles: ["test"]
    build:
      context: .
    entrypoint: ["/app/.venv/bin/python", "-m", "crawling_mcp.test_site"]
    environment:
      TEST_SITE_USERNAME: ${TEST_SITE_USERNAME:-test-user}
      TEST_SITE_PASSWORD: ${TEST_SITE_PASSWORD:-test-password}
      TEST_SITE_PORT: "8765"
    ports:
      - "8765:8765"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-data:
  failures-data:
  screenshots-data:
  postgres-data:
  minio-data:
